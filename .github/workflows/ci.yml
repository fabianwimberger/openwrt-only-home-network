name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SHELLCHECK_VERSION: "v0.11.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJf -
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/

      - name: Lint with shellcheck
        run: |
          # SC2089/SC2090 flag the intentional pattern of building UCI snippets
          # in variables and rendering them with envsubst.
          shellcheck -S warning -e SC2089,SC2090 -s bash \
            wired-ap/build.sh wired-ap/deploy.sh wired-ap/upgrade-all.sh \
            wireless-repeater/build.sh wireless-repeater/deploy.sh wireless-repeater/upgrade-all.sh

      - name: Check bash syntax
        run: |
          for f in wired-ap/*.sh wireless-repeater/*.sh; do
            bash -n "$f"
          done

  test-help:
    name: Test Argument Handling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify usage output and exit codes
        run: |
          for script in wired-ap/build.sh wired-ap/deploy.sh \
                        wireless-repeater/build.sh wireless-repeater/deploy.sh; do
            echo "== $script =="
            if out=$("$script" 2>&1); then
              echo "expected a non-zero exit when called without a profile"
              echo "$out"
              exit 1
            fi
            echo "$out"
            echo "$out" | grep -q "Usage:"
          done
